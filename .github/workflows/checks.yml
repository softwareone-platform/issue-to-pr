name: checks

# This repository publishes by direct push to main, so this workflow is a
# detector rather than a gate -- it reports after the push has already landed.
# The pre-push hook in .githooks is what can actually stop a bad push --
# see tools/README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the version gate compares this commit against the previously
          # published one, so it needs more than a shallow checkout
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Self-check the gates
        # the tool is tested before it is trusted, in that order deliberately
        run: python tools/selfcheck.py

      - name: Resolve the ref the version gate compares against
        id: published
        # Only a push needs this. check.py defaults to origin/main, which is
        # right locally and on a pull request, but on a push to main that ref
        # already points at the commit being pushed, so the comparison would
        # report nothing changed. The push's own before-SHA is the state
        # consumers actually had. HEAD~1 is NOT a substitute: a push carrying
        # several commits would then hide any plugin changed in all but the
        # last of them, which is the exact case this gate exists to catch.
        if: github.event_name == 'push'
        run: |
          before='${{ github.event.before }}'
          # a new branch or a force-push reports an all-zero or unreachable SHA
          if [ -z "$before" ] || ! git rev-parse --verify --quiet "$before^{commit}" >/dev/null; then
            echo "before-SHA '$before' is unusable, falling back to HEAD~1" >&2
            before=HEAD~1
          fi
          echo "ref=$before" >> "$GITHUB_OUTPUT"

      - name: Run the gates against this commit
        env:
          # empty on a pull request, where check.py's own origin/main default is
          # already correct. a gate that cannot resolve its ref says so rather
          # than passing quietly.
          ITPR_PUBLISHED_REF: ${{ steps.published.outputs.ref }}
        run: python tools/check.py
